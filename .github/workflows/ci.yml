name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check publishable tarball
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          for file in src/index.ts src/extension.ts src/config.ts src/schema.ts; do
            grep -q "\"$file\"" /tmp/pack.json || { echo "Missing $file in package tarball"; exit 1; }
          done
